crons:
  - name: gmail-sync
    description: "Pulls new Gmail messages into every team member's Smart Inbox every 15 minutes"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/gmail-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
